name: Job Hunter AI Cloud Runner

on:
  schedule:
    # Rulează automat la fiecare 4 ore
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite rularea manuală direct din interfața GitHub

jobs:
  run-job-hunter:
    runs-on: ubuntu-latest
    steps:
      - name: Preia codul din repository
        uses: actions/checkout@v4

      - name: Configurează Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalează dependențele necesare
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests beautifulsoup4

      - name: Pornește agentul Job Hunter
        run: python main.py